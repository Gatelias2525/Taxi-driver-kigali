<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxi Driver Kigali</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px 20px;
      background: #f5f5f5;
      text-align: center;
    }

    .app {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .driver {
      background: #6f3fa3;
      color: white;
    }

    .passenger {
      background: #f2b632;
      color: black;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>🚕 Taxi Driver Kigali</h1>
    <p>Welcome to Taxi Driver Kigali</p>

    <button class="driver" onclick="alert('Driver section coming soon')">
      I am a Driver
    </button>

    <button class="passenger" onclick="alert('Passenger section coming soon')">
      I need a Taxi
    </button>
  </div>
</body>
</html>
